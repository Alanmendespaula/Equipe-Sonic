# ===================================================================
# PokéSal Simulator - Configurações de Conexão com PostgreSQL
# ===================================================================

spring.application.name=pokesal-simulator
spring.main.banner-mode=off

# DataSource PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pokesal_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Desativação completa de logs de queries SQL e logs internos do Hibernate no console
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.com.ucsal.pokesal=WARN
